# ------------------------------------------------------------------------------
#   Versionen
# ------------------------------------------------------------------------------
# Mod-Version, unabhängig vom Plugin. Tag: "mod-mc<minecraft_version>-<version>" (docs/RELEASES.md).
#   STA-<MAJOR>.<MINOR>.<PATCH>-bu<BUILD> = stabil, BET-... = Beta (z.B. STA-1.4.0-bu002, BET-1.4.1-bu001).
#   MAJOR = große Umbauten, MINOR = neue Funktionen, PATCH = Hotfixes. BUILD zählt die Releases einer Version
#   (jede Beta und die Stable) und beginnt bei jeder neuen Version bei 001. Eine Stable schließt ihre Version ab,
#   die nächste Beta bekommt den nächsten PATCH. 0.x gibt es nur als Beta. Setzt das Release-Skript.
#   Ältere Releases hießen "1.3.1" (Tag mc26.3-v1.3.1).
version=BET-0.1.0-bu001
group=at.marcelr

# Fabric (siehe https://fabricmc.net/develop)
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.2
fabric_api_version=0.164.0+26.3

# Xaero's Minimap und ihre Bibliothek (nur zum Kompilieren, Maven https://chocolateminecraft.com/maven)
xaero_minimap_version=26.6.2
xaero_lib_version=1.8.5

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
