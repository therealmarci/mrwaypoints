# ==============================================================================
#   MRwaypoints - Configuration
# ==============================================================================
#   After changes:   /mrwaypoints reload   (no restart needed)
#   Waypoints:       /waypoints
#   Help & docs:     https://mrtechnology.marcelr.at/docs/mrwaypoints/
#
#   The categories are in categories.yml (same folder) - or edited in MRadmin's web interface.
#   Texts & messages: lang/de.yml or lang/en.yml (see "language" below).
#
#   This file is UTF-8 encoded. If special characters (ä, ö, ü) look wrong,
#   set the encoding in your editor to "UTF-8".
# ==============================================================================

# Do not change - used for automatic config updates.
config-version: 5

# Language of the texts (chat, menus, action bar). The texts are in plugins/MRwaypoints/lang/<language>.yml.
#   auto = every player gets the language set in their Minecraft client:
#          German (also Austria/Switzerland) -> de.yml, English -> en.yml, a language without a file -> fallback-language.
#   de / en / ... = fixed language for all players.
# The console is always English. Own language: copy a file (e.g. as fr.yml) and translate it - with "auto"
# French players then get it automatically.
language: auto

# Language for players whose Minecraft language has no file of its own.
fallback-language: en

# Language of texts that are not meant for a single player (kept for all MR plugins alike; MRwaypoints has none yet).
server-language: en


# ------------------------------------------------------------------------------
#   1) GUIDE
# ------------------------------------------------------------------------------
# A click on a waypoint in /waypoints shows the way in the action bar: an arrow and the distance.
guide:
  # How often the arrow is refreshed (in ticks, 20 = 1 second).
  update-ticks: 5
  # Within this many blocks the guide ends ("You have arrived").
  arrive-distance: 5
  # A short sound on arrival.
  sound: true


# ------------------------------------------------------------------------------
#   2) WAYPOINTS
# ------------------------------------------------------------------------------
# Who may create waypoints is set per category: permission mrwaypoints.create.<category>, or "players-create: true"
# in categories.yml (then mrwaypoints.player is enough). The limit per player is set per category too.
waypoints:
  # Longest name of a waypoint.
  max-name-length: 32


# ------------------------------------------------------------------------------
#   3) MOD FOR XAERO'S MAP
# ------------------------------------------------------------------------------
# Players with the MRwaypoints mod (Fabric, needs Xaero's Minimap) see the server waypoints in Xaero's Minimap and
# World Map and switch categories on and off (key J, button in Xaero's waypoint menu or in /waypoints). Their choice
# is saved on the server (players.yml). Without the mod, menu and guide work as usual.
mod:
  # Oldest version of the mod that is still allowed (e.g. "0.2.1", empty = any compatible version).
  # Which mod versions fit the plugin in principle is built into the plugin (protocol version) - here you
  # can additionally lock out older versions, e.g. because of a bug in the mod.
  minimum-version: ""
  # Where players download the mod (link in the notices).
  download-url: "https://mrtechnology.marcelr.at/download/mrwaypoints/"


# ------------------------------------------------------------------------------
#   4) VIEW IN XAERO'S MAP (players with the mod)
# ------------------------------------------------------------------------------
# Every player sets in /waypoints -> Settings how far and where they see the server waypoints (permission
# mrwaypoints.settings, saved per player in players.yml). These are the choices and the defaults.
view:
  # Ranges to choose from, in chunks to every side of the player, e.g. 10 = 10 chunks (160 blocks) in each direction
  # (0 = unlimited). Only applies in the world and on the minimap - Xaero's own limit for waypoints in the world
  # applies on top.
  ranges: [10, 20, 50, 100, 0]
  # Default range for players who did not change anything (in chunks like above, 0 = unlimited).
  default-range: 0
  # Where the waypoints show by default:
  #   everywhere = in the world, on the minimap and on Xaero's World Map
  #   world-map  = only on Xaero's World Map
  default-display: everywhere
  # Waypoints beyond the distance still show on Xaero's World Map (default for players).
  default-far-on-world-map: true


# ------------------------------------------------------------------------------
#   5) UPDATE CHECK
# ------------------------------------------------------------------------------
update-checker:
  # Look for new versions on startup and regularly afterwards.
  # If a newer version is available, a notice appears in the console.
  enabled: true
  # Source: "github" (GitHub Releases, default) or "modrinth"
  source: github
  # Also report beta/alpha versions. If a pre-release (0.x) is running, they are always reported.
  include-prereleases: false
  # How often to check again (in hours).
  interval-hours: 6
  # Notify players with "mrwaypoints.admin.update" when they join the server.
  notify-on-join: true


# ------------------------------------------------------------------------------
#   6) MENUS
# ------------------------------------------------------------------------------
gui:
  # How often open menus are refreshed (in ticks, 20 = 1 second) - distances stay up to date.
  refresh-ticks: 20
  # Click sounds in the menus.
  sounds: true
