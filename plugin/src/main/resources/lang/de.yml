# Texte der Discord-Logs (Markdown wie in Discord). Platzhalter: {player} {name} {old} {category} {world} {x} {y} {z} {count} {admin}. An/aus und Farbe stehen in der config.yml.
discord:
  test-message: "🔧 Testnachricht von MRwaypoints - der Webhook funktioniert!"
  waypoint-created: "📍 **{player}** hat den Wegpunkt **{name}** ({category}) in **{world}** bei {x} {y} {z} angelegt."
  waypoint-renamed: "✏️ **{player}** hat den Wegpunkt **{old}** in **{name}** umbenannt ({category})."
  waypoint-moved: "🗂️ **{player}** hat den Wegpunkt **{name}** in die Kategorie **{category}** verschoben."
  waypoint-relocated: "📌 **{player}** hat den Wegpunkt **{name}** ({category}) nach {x} {y} {z} in **{world}** versetzt."
  waypoint-deleted: "🗑️ **{player}** hat den Wegpunkt **{name}** ({category}) in **{world}** gelöscht."
  waypoints-bulk-moved: "🗂️ **{player}** hat **{count}** Wegpunkte in die Kategorie **{category}** verschoben."
  waypoints-bulk-deleted: "🗑️ **{player}** hat **{count}** Wegpunkte gelöscht."
  category-created: "🆕 **{player}** hat die Kategorie **{category}** angelegt."
  category-changed: "🛠️ **{player}** hat die Kategorie **{category}** geändert."
  category-deleted: "🗑️ **{player}** hat die Kategorie **{category}** gelöscht."
  category-order: "↕️ **{player}** hat die Reihenfolge der Kategorien geändert."
  teleport: "🌀 **{player}** hat sich zum Wegpunkt **{name}** ({category}) in **{world}** teleportiert."
  admin-reload: "🔄 **{admin}** hat die MRwaypoints-Konfiguration neu geladen."
