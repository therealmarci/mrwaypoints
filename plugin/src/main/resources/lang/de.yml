# ==============================================================================
#   MRwaypoints - Sprachdatei: Deutsch (de)
# ==============================================================================
#   Aktivieren: in der config.yml  language: de  (Standard "auto": jeder Spieler in seiner Sprache)
#   Eigene Sprache: diese Datei kopieren (z.B. als fr.yml) und übersetzen.
#   Fehlende Texte werden bei Updates automatisch ergänzt - deine Änderungen bleiben erhalten.
#
#   Format: MiniMessage - https://docs.advntr.dev/minimessage/format.html
#   Leerer Text ("") = Nachricht wird nicht gesendet.
#   Die Namen der Kategorien stehen nicht hier, sondern in categories.yml (pro Sprache).
# ==============================================================================

# Nicht ändern - damit erkennt das Plugin bei Updates, welche Texte erneuert werden müssen.
lang-version: 2

prefix: "<dark_gray>[<gold>MRwaypoints</gold>]</dark_gray> "

# --- Allgemein ---------------------------------------------------------------
no-permission: "<prefix><red>Dazu hast du keine Berechtigung."
players-only: "<prefix><red>Dieser Befehl kann nur von Spielern genutzt werden."
help-header: "<prefix><gray>Befehle:"
help-waypoints: "<gold>/waypoints [stop]</gold> <dark_gray>- <gray>alle Wegpunkte, Wegweiser beenden"
help-reload: "<gold>/mrwaypoints reload</gold> <dark_gray>- <gray>Config, Kategorien und Texte neu laden"
help-version: "<gold>/mrwaypoints version</gold> <dark_gray>- <gray>Version und Updates"
reloaded: "<prefix><hover:show_text:'<gray><categories> Kategorien, <waypoints> Wegpunkte'><green>Neu geladen</hover>"

# --- Wegweiser (Actionbar) ---------------------------------------------------
