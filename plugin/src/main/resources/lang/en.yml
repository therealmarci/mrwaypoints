# ==============================================================================
#   MRwaypoints - Language file: English (en)
# ==============================================================================
#   Activate: in config.yml  language: en  (default "auto": every player in their own language)
#   Own language: copy this file (e.g. as fr.yml) and translate it.
#   Missing texts are added automatically on updates - your changes are kept.
#
#   Format: MiniMessage - https://docs.advntr.dev/minimessage/format.html
#   Empty text ("") = the message is not sent.
#   The names of the categories are not here but in categories.yml (per language).
# ==============================================================================

# Do not change - tells the plugin which texts need renewing on updates.
lang-version: 3

prefix: "<dark_gray>[<gold>MRwaypoints</gold>]</dark_gray> "

# --- General -----------------------------------------------------------------
no-permission: "<prefix><red>You don't have permission to do that."
players-only: "<prefix><red>Only players can use this command."
help-header: "<prefix><gray>Commands:"
help-waypoints: "<gold>/waypoints [stop]</gold> <dark_gray>- <gray>all waypoints, end the guide"
help-reload: "<gold>/mrwaypoints reload</gold> <dark_gray>- <gray>reload config, categories and texts"
help-version: "<gold>/mrwaypoints version</gold> <dark_gray>- <gray>version and updates"
reloaded: "<prefix><hover:show_text:'<gray><categories> categories, <waypoints> waypoints'><green>Reloaded</hover>"

# --- Guide (action bar) ------------------------------------------------------
guide-started: "<prefix><hover:show_text:'<gray>Arrow and distance in the action bar - end it with /waypoints stop'><gray>Guiding you to <white><name></white></hover>"
guide-stopped: "<prefix><gray>Guide ended."
guide-none: "<prefix><gray>No guide is running."
guide-gone: "<prefix><gray>The waypoint was deleted - guide ended."
guide-arrived: "<prefix><green>Arrived: <white><name>"
# Placeholders: <arrow> <name> (in the colour of the category) <distance> <height>
guide-actionbar: "<gold><arrow></gold> <name> <gray><distance> m</gray><height>"
guide-other-world: "<name> <gray>is in <white><world></white>"
guide-up: " <dark_gray>▲ <blocks>"
guide-down: " <dark_gray>▼ <blocks>"

# --- Create and edit ---------------------------------------------------------
create-no-permission: "<prefix><red>You may not create waypoints in <white><category></white>."
create-limit: "<prefix><hover:show_text:'<gray>At most <max> own waypoints per player - delete an old one'><red>Limit reached in <white><category></white></hover>"
created: "<prefix><hover:show_text:'<gray><category> · <x> <y> <z>'><green>Waypoint <white><name></white> created</hover>"
renamed: "<prefix><hover:show_text:'<gray>before: <old>'><green>Renamed to <white><name></white></hover>"
moved: "<prefix><hover:show_text:'<gray>new: <x> <y> <z>'><green><white><name></white> is here now</hover>"
deleted: "<prefix><gray>Waypoint <white><name></white> deleted."
teleported: "<prefix><gray>Teleported to <white><name></white>."
world-not-loaded: "<prefix><red>The world <white><world></white> is not loaded right now."
edit-no-permission: "<prefix><red>You may not edit this waypoint."
name-empty: "<prefix><red>The name must not be empty."
name-too-long: "<prefix><red>The name is too long <gray>(at most <max> characters)"
name-taken: "<prefix><red>There already is <white><name></white> in this category."

